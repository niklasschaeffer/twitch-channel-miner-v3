services:
  twitch-miner:
    image: ghcr.io/niklasschaeffer/twitch-channel-miner-v3:latest
    container_name: twitch-channel-points-miner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TWITCH_CLIENT_ID: ue6666qo983tsx6so1t0vnawi233wa
      APP_URL: http://localhost:3000
      ALLOW_REGISTRATION: "false"
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
