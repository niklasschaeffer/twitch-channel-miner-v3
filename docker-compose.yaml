version: '3.8'

services:
  twitch-miner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twitch-channel-points-miner
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/miner.db
    volumes:
      - miner-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  miner-data:
    name: twitch_miner_sqlite_data
